<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Free Account | PurseLens</title>
    <link rel="stylesheet" href="../../css/pages/register.css">
    <link rel="stylesheet" href="../../css/themes/light.css">
    <link rel="shortcut icon" href="../../assets/images/PurseLens_logo.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <section class="sign-up-section">
            <div class="main-container">

                <div class="title-wrapper">

                    <img src="../../assets/images/PurseLens_logo.png" alt="PurseLens logo">

                    <span>PurseLens</span>

                </div>

                <div class="heading-wrapper">

                    <h2>Create Your Free Account</h2>

                    <p>Join thousands who have taken control of their financial narrative.</p>

                </div>

                <form action="/api/auth/register/" method="POST" id="signup-form">

                    <fieldset>

                        <label class="required" for="first-name">First name</label>

                        <input type="text" name="first_name" id="first-name"
                            placeholder="James" autocomplete="given-name" required aria-required="true">
                        
                    </fieldset>

                    <fieldset>

                        <label class="required" for="last-name">Last name</label>
                        
                        <input type="text" name="last_name" id="last-name"
                            placeholder="Doe" autocomplete="family-name" required aria-required="true">
                        
                    </fieldset>

                    <fieldset>

                        <label class="required" for="email-input">Email</label>
                        
                        <input type="email" name="email" id="email-input" 
                            placeholder="name@example.com" 
                            autocomplete="email" required aria-required="true">
                        
                    </fieldset>

                    <fieldset>

                        <label class="required" for="password-input">Password</label>
                        
                        <div class="input-wrapper">

                            <input type="password" name="password" id="password-input" 
                                placeholder="•••••••••••" required aria-required="true"
                                autocomplete="new-password">

                            <button type="button" class="toggle-pw-btn"
                                aria-label="Show password"
                                title="Show password"
                                aria-pressed="false"
                                onclick="togglePassword(this)">

                                <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-eye"
                                    viewBox="0 0 16 16">
                                    <path
                                        d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z" />
                                    <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0" />
                                </svg>

                                <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-eye-slash-fill"
                                    viewBox="0 0 16 16">
                                    <path
                                        d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7 7 0 0 0 2.79-.588M5.21 3.088A7 7 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474z" />
                                    <path
                                        d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12z" />
                                </svg>

                            </button>
                        </div>
                        
                    </fieldset>

                    <button type="submit" id="submit-btn">

                        <div class="loader"></div>

                        <span class="text-span">Create Account</span>

                    </button>

                </form>

                <div class="social-wrapper">

                    <div class="divider">

                        <hr class="divider-line"> 
                        
                        <p>Or continue with</p>
                        
                        <hr class="divider-line">
                        
                    </div>

                    <div class="options-wrapper">
                        <div class="oauth-wrapper">
                            
                            <a href="http://{domain_main}/accounts/google/login/callback/">
                                <img src="../../assets/images/google-logo.png" alt="Google logo">
                                continue with Google
                            </a>

                        </div>

                        <div class="sign-in-wrapper">

                            <p>Already have an account?</p>
                            
                            <a href="../../pages/auth/login.html"><strong>Login</strong></a>
                            
                        </div>
                    </div>

                </div>
            </div>

            <div class="input-validation-wrapper">
                <p class="message-output"></p>
            </div>
        </section>

    </main>


    <footer>
        <small>© 2026 PurseLens · <a href="../../policy_privacy.html">Privacy Policy</a>  <a href="../../terms_of_service.html">Terms of Service</a></small>
    </footer>

    <script src="../../js/api/apiClient.js"></script>
    <script src="../../js/api/authApi.js"></script>
    <script src="../../js/auth/signup.js"></script>
</body>
</html>
